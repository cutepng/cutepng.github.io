<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      position: relative;
      background: #000;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .video-bg iframe {
      width: 177.78vh;
      height: 100vw;
      min-width: 100%;
      min-height: 100%;
      border: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .overlay {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.3));
    }

    .card {
      width: min(100%, 760px);
      text-align: center;
      padding: 2.5rem;
      border-radius: 24px;
      background: rgba(8, 15, 35, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff4d79, #ff8f3f);
      color: white;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 4.2vw, 3.2rem);
      margin: 0 0 1rem;
      font-weight: 800;
      line-height: 1.2;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      margin: 0 auto 1.2rem;
      max-width: 580px;
      color: #e8f2ff;
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #d7e6ff;
    }

    .footer a {
      color: #ffd166;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="video-bg">
    <iframe
      src="https://www.youtube.com/embed/TPyXCFmG2Ws?autoplay=1&mute=1&loop=1&playlist=TPyXCFmG2Ws&controls=0&showinfo=0&rel=0"
      title="Background video"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <div class="overlay">
    <div class="card">
      <div class="badge">Under Construction</div>
      <h1>We are under Maintenance.<br />We will be back soon.</h1>
      <p>Our website is being refreshed with a new look and improved experience.</p>
      <div class="footer">
        By: <a href="https://www.weddingvectors.com" target="_blank" rel="noopener noreferrer">www.weddingvectors.com</a>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      position: relative;
      background:
        radial-gradient(circle at top left, rgba(255, 77, 121, 0.55), transparent 30%),
        radial-gradient(circle at bottom right, rgba(0, 184, 255, 0.45), transparent 35%),
        linear-gradient(135deg, #0f172a, #1e293b 55%, #334155);
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(120deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
        radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px);
      background-size: auto, 18px 18px;
      opacity: 0.35;
      pointer-events: none;
    }

    .overlay {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, rgba(255, 0, 128, 0.2), rgba(0, 184, 255, 0.15), rgba(255, 199, 0, 0.12));
    }

    .card {
      width: min(100%, 760px);
      text-align: center;
      padding: 2.5rem;
      border-radius: 24px;
      background: rgba(8, 15, 35, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff4d79, #ff8f3f);
      color: white;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 4.2vw, 3.2rem);
      margin: 0 0 1rem;
      font-weight: 800;
      line-height: 1.2;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      margin: 0 auto 1.2rem;
      max-width: 580px;
      color: #e8f2ff;
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #d7e6ff;
    }

    .footer a {
      color: #ffd166;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="overlay">
    <div class="card">
      <div class="badge">Under Construction</div>
      <h1>We are under Maintenance.<br />We will be back soon.</h1>
      <p>Our website is being refreshed with a new look and improved experience.</p>
      <div class="footer">
        By: <a href="https://www.weddingvectors.com" target="_blank" rel="noopener noreferrer">www.weddingvectors.com</a>
      </div>
    </div>
  </div>
</body>
</html>
